name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # The site embeds the TV app as its live demo and borrows its shared
      # modules, so an app change changes the site too.
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'icon.png'
      - 'tools/build-site.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # Assembles _site/: the pages, the shared modules copied out of the app,
      # and the app itself as demo/. Same script used locally.
      - run: node tools/build-site.mjs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
