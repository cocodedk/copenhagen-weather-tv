<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080,user-scalable=no">
<title>Copenhagen Weather</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/widgets.css">
</head>
<body class="theme-auto">

    </g>
    <circle cx="32" cy="44" r="4" fill="currentColor"/>

  <symbol id="i-sunrise" viewBox="0 0 64 64">
    <circle cx="32" cy="40" r="10" fill="currentColor"/>
    <g stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="6" y1="54" x2="58" y2="54"/><line x1="32" y1="8" x2="32" y2="18"/>

  <symbol id="i-uv" viewBox="0 0 64 64">

<div id="app">

  <header id="hdr">
    <div id="hdr-left">
      <h1 id="city">Copenhagen</h1>
      <div id="subtitle">Denmark</div>
    </div>
    <div id="hdr-right">
      <div id="clock">--:--</div>
      <div id="clock-date">&nbsp;</div>
    </div>
  </header>

  <section id="hero">
    <div id="hero-main">
      <svg id="hero-icon" class="wx-icon" viewBox="0 0 64 64"><use id="hero-use" href="#i-cloudy" xlink:href="#i-cloudy"/></svg>
      <div id="hero-text">
        <div id="hero-temp">--<span id="hero-unit">°C</span></div>
        <div id="hero-cond">Loading forecast…</div>
        <div id="hero-range">&nbsp;</div>
      </div>
    </div>
    <div id="stats"></div>
  </section>

  <section id="hourly-block">
    <h2 class="section-title">Hour by hour <span id="hourly-scope" class="section-note"></span></h2>
    <div id="hourly-strip"></div>
  </section>

  <section id="daily-block">
    <h2 class="section-title">Next 7 days</h2>
    <div id="daily-row"></div>
  </section>

  <footer id="ftr">
    <div id="legend">
      <span class="ck ck-r"></span>Refresh
      <span class="ck ck-g"></span><span id="legend-unit">°F</span>
      <span class="ck ck-y"></span>Theme
      <span class="ck ck-b"></span>Diagnostics
      <span class="legend-sep">·</span><span class="legend-dim">1–7 jump to day · OK select · Back exit</span>
    </div>
    <div id="status">Loading…</div>
  </footer>

</div>

<div id="toast" hidden></div>

<div id="dialog" hidden>
  <div id="dialog-box">
    <div id="dialog-title">Exit Copenhagen Weather?</div>
    <div id="dialog-actions">
      <div class="dlg-btn" id="dlg-yes">Exit</div>
      <div class="dlg-btn" id="dlg-no">Stay</div>
    </div>
  </div>
</div>

<!-- Substitute for DevTools: there is none on a retail TV. -->
<div id="debug" hidden></div>
<div id="build-stamp">b1</div>

<script src="js/wmo.js"></script>
<script src="js/units.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
